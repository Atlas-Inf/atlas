[model]
name = "gemma-4-e2b"
hf_id = "google/gemma-4-E2B-it"
model_type = "gemma4"
architecture = "dense_attention"
parameters = "5B"
active_parameters = "5B"

# Per-Layer Embeddings (PLE) + cross-layer KV sharing (num_kv_shared_layers=20).
# Layer pattern is 4:1 (sliding x4, full) across 35 layers — full at
# indices 4, 9, 14, 19, 24, 29, 34.
layers_total = 35
layers_sliding_attention = 28
layers_full_attention = 7
layer_pattern = "4:1 (sliding x4, full); 7 full layers"

hidden_dim = 1536
head_dim = 256
global_head_dim = 512
q_heads = 8
kv_heads = 1
num_global_kv_heads = 1

# Config intermediate_size is 6144; layers 15-34 (the KV-shared band) are
# double-wide (12288) via use_double_wide_mlp — see config.json text_config.
intermediate_size = 6144
moe_intermediate_size = 0
moe_experts = 0
moe_top_k = 0
vocab_size = 262144
max_position_embeddings = 131072
sliding_window = 512

rope_theta_sliding = 10000.0
rope_theta_full = 1000000.0
partial_rotary_factor = 0.25

rms_norm_eps = 1e-6
hidden_activation = "gelu_pytorch_tanh"
tie_word_embeddings = true
final_logit_softcapping = 30.0

vision = true
mtp_layers = 0

# Effective context for agentic tasks (tokens). E2B has 128K positional budget
# but sliding window 512 constrains effective context for tool calling.
effective_context = 16384

# Google-recommended sampling recipe (model card): temp 1.0, top_p 0.95,
# top_k 64. No penalty/DRY band-aids (Google ships penalty-free).
[sampling.thinking_text]
temperature = 1.0
top_p = 0.95
top_k = 64
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.thinking_coding]
temperature = 1.0
top_p = 0.95
top_k = 64
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.non_thinking]
temperature = 1.0
top_p = 0.95
top_k = 64
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.tools]
temperature = 1.0
top_p = 0.95
top_k = 64
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[behavior]
# Gemma-4 uses <|channel>thought\n...<channel|> for thinking, structurally
# separate from tool calls. Enable thinking with tools.
thinking_in_tools = true
max_thinking_budget = 2048
# BF16 KV cache — same rationale as Gemma-4 31B (large final-norm weights exceed
# FP8 E4M3 range; vLLM also uses BF16 for Gemma 4).
default_kv_dtype = "bf16"

[[model_types]]
model_type = "gemma4"
hidden_size = 1536

[kernel]
# No MoE gate shared memory needed (dense model).

# ── Quantized-FFN probe fallbacks (BF16 target) ────────────────────────────
# gemma-4-E2B runs native-BF16 weights end-to-end (same as gemma-4-31b), so
# every quantized GEMM/MMQ family below is a try_kernel() probe whose handle
# stays 0 and whose dispatch falls back to the resolved BF16/dense path. The
# KERNEL set ships no nvfp4_mmq / q4k_mmq / w4a4 modules, and the w4a16
# entries are shadow-only twins or int8/NVFP4-source paths this checkpoint
# never materializes. Mirrors gemma-4-31b/MODEL.toml §expected_absent.
[expected_absent.w4a16]
w4a16_gemm_t_p3 = "Deep-K p3 twin shipped only in qwen3.6-27b's shadow; layers::tgemm_kernel falls back to w4a16_gemm_t (resolves: common). Unmeasured for BF16-serving targets."
w4a16_gemm_t_k64_p3 = "Same family; k64_kernel falls back to required w4a16_gemm_t_k64 (resolves)."
w4a16_gemm_t_k64_n64_p3 = "Narrow-N twin; 0-handle gated at dispatch (K64_N64_MAX_WIDE_CTAS)."
w4a16_gemm_t_m128_bf16 = "BF16-projection prefill twin; dispatch gated on handle != 0, falls back to resolved w4a16 m128 path."
w4a16_gemm_t_m128_bf16_v2 = "Pipelined v2 of the above; same gating. Unmeasured."
int8_gemm_faith2 = """
INT8-prefill twin (faith2). Only materialized when finalize_int8_load
finds int8 weights AND the resolved handles — this BF16 checkpoint has
no int8 path; dispatch gated by handle != 0."""
int8_gemm_i32acc = "Same int8 family — BF16 checkpoint never materializes it."
requant_w_nvfp4_int8 = "Int8 weight requant from NVFP4 weights; this checkpoint is BF16, no NVFP4 source weights exist."
requant_a_bf16_int8 = "Same int8 family — activation requant; gated by the same weight-presence condition."

[expected_absent.w4a4]
w4a4_gemm = "NVFP4 W4A4 GEMM; BF16 checkpoint has no NVFP4 weights. Fallback resolves through w4a16."
w4a4_gemm_mfast = "mfast twin shipped only in nemotron-labs-3-puzzle's shadow; same NVFP4-weight gating applies here."

[expected_absent.q4k_mmq]
atlas_q4k_mmq128_nc = """
Q4_K FFN MMQ family — finalize_q4k_load requires ALL handles non-zero
AND ATLAS_FFN_MMQ presence, then requantizes NVFP4 weights to Q4_K.
This BF16-target's KERNEL set does not ship the module; gate fails on
handle == 0 and stays on the resolved bf16/dense path."""
atlas_q4k_mmq128_wc = "Same Q4_K family — gated off for this target (see atlas_q4k_mmq128_nc)."
atlas_q8_1_quantize_ds4_bf16 = "Same Q4_K family — activation quantizer; gated off."

[expected_absent.q4k_quantize]
q4k_quantize = "Q4_K weight quantizer for the MMQ family; gated off with the family (see q4k_mmq::atlas_q4k_mmq128_nc)."

[expected_absent.nvfp4_mmq]
atlas_nvfp4_mmq128_nc = """
NVFP4 MMQ FFN family. finalize_nvfp4_mmq_load requantizes NVFP4 weights;
this target runs BF16 so the family is never materialized, and the
KERNEL set ships no nvfp4_mmq module. Probe is gated by handle != 0."""
atlas_nvfp4_mmq128_wc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq16_nc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq16_wc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq32_nc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq32_wc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq64_nc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq64_wc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_quantize_bf16 = "NVFP4 activation quantizer; gated off with the family."
atlas_nvfp4_repack = "NVFP4 weight repacker; gated off with the family."
atlas_nvfp4_silu_mul_scaled = "NVFP4 SiLU epilogue; gated off with the family."
atlas_nvfp4_silu_mul_quant = "NVFP4 SiLU epilogue (quantized); gated off with the family."
atlas_nvfp4_scale_bf16 = "NVFP4 scale handler; gated off with the family."
