# Benchmarks for this model, and the thresholds its gate records must meet.
#
# Sibling of MODEL.toml so the numbers sit beside the thing they describe;
# hardware and model are implied by the path and cannot disagree with the
# contents. Read by `atlas_plugin::gate::bench`.
#
# Thresholds are per CHECKPOINT, not per model: two checkpoints of one model
# can differ by several BFCL points, so they cannot share a bar.
#
# This file is deliberately OUTSIDE the closure hash (`taxon::configs` does not
# list it), so ratcheting a threshold does not invalidate the record that
# justified the ratchet.
#
# `status = "unmeasured"` entries carry NO [benchmarks.metrics] table. Absence
# is the TODO -- a guessed threshold a run could clear would report PASS for
# something nobody measured.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.6-27B-NVFP4"
gate = "bfcl-subset"
recipe = "qwen3.6/qwen3.6-27b-nvfp4-unsloth"
# NO LONGER THE REQUIRED bfcl-subset SUBJECT (flipped 2026-08-15). The required
# gate model is now unsloth/Qwen3.8-27B-NVFP4 (kernels/gb10/qwen3.8-27b/BENCH.toml).
# Retained as a non-default measured entry for historical provenance and so the
# 3.6 leg can still be run on demand with `--checkpoint unsloth/Qwen3.6-27B-NVFP4`.
# ★ CONSEQUENCE: the MLPerf-edge submission rides on THIS checkpoint, and with it
# out of the required set nothing guards the submitted config on every PR — re-run
# this leg by hand before any MLPerf-facing claim (accepted trade, 2026-08-15).
default = false
status = "measured"
note = """\
Gate D. Golden ST-995 draw (62/10/10, floor 25, n=995, seed 42, temp 0) on the DENSE 27B — \
the MLPerf-edge submission model, which is the model these numbers are defined for. \
THRESHOLDS ARE THE HIGH-WATER RATCHET, NOT THE FLOOR: 87.44 overall is the best \
like-for-like value ever recorded under these serve flags (2026-07-13 prestack b45af988); \
88.59 normalized is the best (2026-07-26 pr369 de6153f3). Ratcheting to best-ever rather \
than to a survivable floor is deliberate — it catches regression from our best instead of \
only catching catastrophe, and it stops repeated sub-noise dips silently walking the gate \
down over successive PRs. `noise` is the MEASURED +/-0.4 MTP-greedy-nondeterminism band on \
this model: a bit-identical change has swung overall by 0.40, so a dip inside it is not \
signal. The MLPerf-edge floor (83.64 / 85.32, = llama.cpp Q4_K_M golden 86.23/87.96 x 0.97) \
is NOT repeated as a field here because this schema enforces only `metrics` and an extra key \
would be silently ignored — it is subsumed, since 87.44 > 83.64 and 88.59 > 85.32. If these \
mins are ever lowered, re-check them against that floor by hand: dropping below it is an \
outright MLPerf submission failure, not a regression. Do NOT score the echolp n=1004 draw \
against these numbers — see bfcl-subset-echolp. History: 2026-07-13 prestack b45af988 \
87.44/88.53 (overall high-water); 2026-07-13 main d77bdf84 87.24/88.40; 2026-07-26 pr369 \
de6153f3 87.34/88.59 (normalized high-water); 2026-08-03 PR #388 Gate D 87.74/89.43 n=995. \
The draw is PINNED at n=995: a score from a different draw is not comparable to these \
thresholds, and the sample count is the only thing that reveals it after the fact, so it is \
gated exactly rather than merely recorded."""

[benchmarks.metrics.normalized_single_turn_score]
min = 88.59
noise = 0.4

[benchmarks.metrics.overall_accuracy]
min = 87.44
noise = 0.4

[benchmarks.metrics.samples]
min = 995
max = 995

# --- vision-fidelity -------------------------------------------------------
# Vision models only. This gate is declared on the three targets that ship a
# vision tower and have a BENCH.toml; a text-only target has no entry and the
# gate simply does not apply to it.
#
# The bounds are ABSOLUTE and take no noise term, like the cross-contamination
# gate's. Vision-token count is arithmetic over the patch grid -- there is no
# run-to-run variance for a tolerance to absorb, so any movement is a real
# change in preprocessing. That is the property that makes this gate worth
# requiring: the 2026-08-14 resolution-cap defect silently reduced every image
# above 1280px to about a tenth of its permitted area, and every capability
# check passed throughout, because a downscaled picture is still recognisably
# what it is.
#
#   integrity_passed  = 10  the INTEGRITY floor, and the legs a single
#                           well-formed request cannot reach. Every one of
#                           them fails as a FLUENT ANSWER TO THE WRONG INPUT
#                           rather than an error, which is the class this
#                           repo keeps rediscovering:
#                             heterogeneous-concurrency  four DIFFERENT
#                               requests in flight (one text-only), each
#                               scored against its own input. Identical
#                               requests cannot test the per-request offsets
#                               into the shared ViT output buffer, because
#                               every offset is then interchangeable.
#                             prefix-cache-isolation     same prompt text,
#                               different image, back to back. Guards the
#                               predicate that keeps vision prompts out of
#                               the prefix cache — it silently missed the
#                               VIDEO pad token until 2026-08-14.
#                             long-prompt-splice         a prompt past the
#                               single-chunk budget, which leaves the batched
#                               co-dispatch encode for a second splice in a
#                               different file. Measured 81 vs 7082 prompt
#                               tokens, so it really does cross over.
#                             media-in-history           the image in an
#                               earlier turn, not in the message asking the
#                               question. The #165 path.
#                             exif-orientation-pinned    PINS current
#                               behaviour rather than judging it: EXIF
#                               orientation is IGNORED, measured 2026-08-14.
#                               A rotated phone photo reaches the model
#                               sideways. Whether to honour the tag is a
#                               product decision; that it must not change by
#                               accident is not.
#                             stream-blocking-parity     the SAME request
#                               streamed and not. Every other leg sets
#                               stream:true, so the blocking path — which
#                               assembles its own response — was never run.
#                               Both must answer correctly AND agree on
#                               prompt_tokens; a difference means the two
#                               paths built different prompts from identical
#                               bytes.
#                             multi-choice-image         n=2 with an image.
#                               The blocking path gives only choice 0 the
#                               pixels (the encode is shared), which is
#                               correct and is also index-conditional code
#                               nothing ran.
#                             image-on-tool-result       the image arriving
#                               on a role:"tool" message — the OTHER call
#                               site of collect_message_images, and the case
#                               #165 exists for.
#                             thinking-on-vision         the DEFAULT config
#                               for these checkpoints, which every other leg
#                               turns off. Thinking lengthens the prompt and
#                               so moves which prefill chunk the pad run lands
#                               in. Asserted as a DIFFERENCE between two
#                               images so the unknown <think> cost cancels.
#   integrity_measured = 10 a skipped integrity leg is not a passed one.
#   geometry_matched  = 14  the CORRECTNESS floor, and the one that moves when
#                           preprocessing changes. Rung 09 (1600x900) is the
#                           ONLY rung above the retired 1280px clamp: under the
#                           clamp it is 920 tokens, un-downscaled it is 1400.
#                           The other eight fit under either regime and so
#                           cannot tell the two apart -- without rung 09 this
#                           gate could not fail on the defect it exists for.
#   geometry_asserted = 14  the MEASUREMENT floor, which is a DIFFERENT failure.
#                           A cell the server cannot serve reports UNMEASURED,
#                           which is not a mismatch -- so without this floor an
#                           encoder-capacity regression would turn every cell
#                           UNMEASURED and still read as PASS. Both are kept
#                           because neither implies the other.
#   probes_passed     = 3   capability, all three.
#   control_held      = 1   the no-image control MUST hold. The non-vacuity
#                           requirement expressed as a threshold: if the control
#                           answers as though it saw a picture, the probes are
#                           not evidence and the run is VACUOUS.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.6-27B-NVFP4"
gate = "vision-fidelity"
recipe = "qwen3.6/qwen3.6-27b-nvfp4-unsloth"
label = "Qwen3.6-27B dense (NVFP4, unsloth)"
default = false
status = "measured"
note = """\
REFERENCE RUN 2026-08-14, dgx-00, binary feat/video-support @ 5a22d7ce: PASS, 14/14 geometry \
cells matched, 3/3 probes, 10/10 integrity legs, control held, 29.3 s. Geometry was IDENTICAL across all \
three vision targets (49/121/192/220/576/576/920/405/1400/1/128/49/49/49 merged \
tokens) -- token \
count is a property of the preprocessor rather than the checkpoint, so agreement \
across a dense NVFP4, an unsloth NVFP4 and an FP8 MoE is evidence the arithmetic is \
right rather than a coincidence. * THIS is the checkpoint that exposed the resolver \
defect. It ships processor_config.json and NO preprocessor_config.json, and Atlas read \
only the latter -- so it declared 16777216 px under image_processor.size and was \
served at the 1280px fallback with a 6400-patch encoder anyway. An earlier record here \
said this checkpoint declared no bound; that was the missing reader, not the \
checkpoint. With the fix it resolves 16.7M px, capacity clamps to 16384, and rung 09 \
reports 1400 where the fallback produced 920 -- the gate catching exactly the class of \
defect it was built for, on a real model rather than in a unit test."""

[benchmarks.metrics.geometry_matched]
min = 14.0

[benchmarks.metrics.geometry_asserted]
min = 14.0

[benchmarks.metrics.integrity_passed]
min = 10.0

[benchmarks.metrics.integrity_measured]
min = 10.0

[benchmarks.metrics.probes_passed]
min = 3.0

[benchmarks.metrics.control_held]
min = 1.0

# --- video-fidelity --------------------------------------------------------
# The second video target, added after a measured run rather than by analogy
# with qwen3.8-27b. See that target's entry for what each leg asserts and why
# the reversed clip is the one that matters.
#
# ★ REQUIRES FFMPEG ON THE SERVER for every container except GIF — and the
# serve must be started with `--video-allow-ffmpeg`, which the subprocess
# decoder is gated behind. The recipe above pins `video_allow_ffmpeg: true`
# (added 2026-08-15) so the certified self-start gets it; without that pin
# every MP4 leg 400'd and the gate went red, and `--serve-override` could not
# rescue it because it refuses keys absent from the recipe's defaults.
# Without the flag the MP4 legs SKIP at the benchmark level (never fail), but
# a skip can only degrade a MANUAL run gracefully — this GATE still goes red,
# because the thresholds below demand all 13 legs and 0 skips. That is
# deliberate: a certified record must exercise the MP4 path.
#
# RESOLVED 2026-08-15, and the answer was the second one. On 2026-08-14 the
# 35B scored 12/13, failing `video-before-image` with [yellow, green, blue]
# where [red, green, blue, yellow] was expected, while reading the clip
# correctly in every other arrangement — and the open question was whether
# that was a model-capacity limit on the A3B MoE or an ordering defect that
# only surfaces there. It was an ORDERING DEFECT, present on all three
# targets: media travelled as one list per modality, so a video sent before an
# image was rendered after it. The dense targets recovered from the
# contradiction and the A3B did not, which is the only reason it looked
# checkpoint-specific. Fixed, and the 35B now declares this gate itself.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.6-27B-NVFP4"
gate = "video-fidelity"
recipe = "qwen3.6/qwen3.6-27b-nvfp4-unsloth"
label = "Qwen3.6-27B dense (NVFP4, unsloth)"
# `default = false` since 2026-10-21: nvidia/Qwen3.8-27B-NVFP4 (qwen3.8-27b)
# owns the gate's required subject again. The 3.8 "edge" this entry stood in
# for (2026-08-15 .. 2026-10-21) was Atlas's video prompt, not the model:
# Qwen3-VL emits a timestamp and its own start/end marker pair per temporal
# group and gives each group a t=1 MRoPE plane, and Atlas rendered one flat
# block. With that fixed the nvidia checkpoint passes 13/13 under its own
# recipe; see its entry. Thresholds unchanged.
default = false
status = "measured"
note = """\
REFERENCE RUN 2026-08-14, dgx-00, binary feat/video-support: PASS, 13/13 legs, 0 \
skipped, control held. Confirms video is not specific to the Qwen3.8 checkpoint — all \
three vision targets declare <|video_pad|> 248057 and share the Qwen3-VL temporal \
geometry, and this one decodes, groups and orders a clip identically. `default = \
false`: qwen3.8-27b owns this gate's default serve."""

[benchmarks.metrics.legs_passed]
min = 13.0

[benchmarks.metrics.legs_skipped]
max = 0.0

[benchmarks.metrics.control_held]
min = 1.0
