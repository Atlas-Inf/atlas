# Thinking Machines Inkling 2 Mini (`model_type: inkling2_loop`), Strict.
# Its message blocks reach the reasoning and tool paths through spark-server's
# inkling_turn.rs (reasoning parser `inkling2`, tool parser `hermes`). Images:
# the checkpoint's 23-layer ViT (`vision_encoder` module, spark-model's
# inkling2_vision.rs), one token per 40x40 pixel tile, no resize.
#
# 24 physical layers (20 sliding-window 1024 + 4 full), the core 6-17 run
# three times with shared weights: the engine sees 48 visits, each with its
# own BF16 KV pool and conv state. No RoPE: a learned relative-position bias
# and per-token sinks in attention, L2-clipped q/k, gamma-free v norm, short
# causal convs, block attention residuals, a 128-expert top-8 sigmoid-routed
# MoE with a softcapped SwiGLU, final logit softcap 30.
# Checkpoint formats are kept (Strict): NVFP4 experts in layers 0-19, MXFP8 in
# 20-23 (read from the stacked tensors by this target's own kernels), BF16
# everything else.
#
# KERNELS: the compiled set is Laguna-S-2.1's (`kernel_source`): head_dim 128
# BF16 paged attention support, BF16 KV write, dense GEMVs, sigmoid top-k.
# This target's `nvfp4/` overlay adds the Inkling kernels (decode attention
# with relative bias and sinks, short convs, block residuals, head epilogues,
# loop message gates, stacked-expert MoE, glue) and the logit softcap.

[model]
name = "inkling-2-mini"
hf_id = "thinkingmachines/Inkling-2-Mini"
model_type = "inkling2_loop"
architecture = "Looped hybrid sliding/full attention MoE (no RoPE, relative bias, block attention residuals)"
parameters = "26.4B-A3.4B"
kernel_source = "laguna-s-2.1"
layers_total = 48
layers_sliding_attention = 40
layers_full_attention = 8
layer_pattern = "24 physical layers (5 sliding + 1 full, x4); layers 6-17 run three times"
hidden_dim = 2304
head_dim = 128
q_heads = 24
kv_heads = 8
moe_experts = 128
moe_topk = 8
moe_intermediate = 1152
moe_scoring_func = "sigmoid"
moe_routing_bias = true
vocab_size = 201024
max_position_embeddings = 1048576
sliding_window = 1024
vision = true
mtp_layers = 0

# Neutral presets until the release's own defaults are wired; request values win.
[sampling.thinking_text]
temperature = 1.0
top_p = 1.0
top_k = 0
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0
min_p = 0.0
top_n_sigma = 0.0

[sampling.thinking_coding]
temperature = 1.0
top_p = 1.0
top_k = 0
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0
min_p = 0.0
top_n_sigma = 0.0

[sampling.non_thinking]
temperature = 1.0
top_p = 1.0
top_k = 0
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0
min_p = 0.0
top_n_sigma = 0.0

[sampling.tools]
temperature = 1.0
top_p = 1.0
top_k = 0
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0
min_p = 0.0
top_n_sigma = 0.0

[behavior]
# Budget forcing: the scheduler tracks the reasoning block by Inkling's
# markers (`SchedLimits::message_open`) and closes it with `<|end_message|>`
# at a sentence boundary once it runs past its budget or loops (the card
# warns of "let me reconsider" cycles at high effort; vLLM loops on the same
# prompts). The ceiling anchors the effort ladder: minimal 2K, low 4K,
# medium (and effort-silent) 8K, high 16K, xhigh 32K reasoning tokens.
max_thinking_budget = 8192
enable_think_loop_watchdog = true
# The model's own close is never held back (no A4 `</think>` floor): at low
# effort its reasoning is short.
min_reasoning_floor_tokens = 0
# Its reasoning was always speculated (the blocks gave the scheduler no
# thinking span before budget forcing); keep it so.
spec_think = true
# An end token ends the turn wherever it comes, as before reasoning was tracked.
eos_ends_thinking = true
honor_eos_inside_thinking = true
confidence_early_stop = false
rollback_resteer = false
thinking_in_tools = true
cap_thinking_at_max_tokens = false
# Inkling reasons by default: an effort-silent request renders the template's
# own default effort (0.9), as transformers does.
thinking_default = true
verbatim_prompt = true
default_kv_dtype = "bf16"
use_sampling_presets_for_core = true
disable_cwd_hint_injection = true
# Inkling calls tools in its own JSON blocks (spark-server inkling_turn.rs maps
# them to Hermes after generation); a Hermes grammar would force a format the
# checkpoint never emits.
disable_tool_grammar = true
# 2026-11-21 RigMark (Strict, temp 0): the stream loop guard ended a Go answer
# with table-driven tests at 2,982 tokens (a 30-character phrase seen four
# times, reported as `length`). As on SparkQwen/SparkGLM, a loop runs to the
# request's max_tokens; clients bound it there.
enable_loop_watchdog = false
enable_stream_loop_guards = false

[[model_types]]
model_type = "inkling2_loop"
hidden_size = 2304

# Probed at model build for dense NVFP4 FFNs, which Inkling has none of (its
# MoE runs this target's own stacked-expert kernels).
[expected_absent.w4a16]
w4a16_gemm_t_p3 = "3-deep pipeline twin shipped only in qwen3.6-27b's shadow; probed by the model build, never dispatched for Inkling (no dense NVFP4 FFN)."
fp8_gemm_t_row_scaled = "FP8 drafter twin of the DFlash head (ATLAS_DFLASH_FP8 drafters only); the Inkling 2 DSpark drafter is BF16 with NVFP4 layer twins."
fp8_gemm_t_row_scaled_m16 = "Small-M FP8 drafter head GEMM (DflashQuantization::Fp8Weights only); never dispatched for the BF16 Inkling 2 DSpark drafter."
