# Benchmarks for this model, and the thresholds its gate records must meet.
#
# Sibling of MODEL.toml so the numbers sit beside the thing they describe;
# hardware and model are implied by the path and cannot disagree with the
# contents. Read by `atlas_plugin::gate::bench`.
#
# Thresholds are per CHECKPOINT, not per model: two checkpoints of one model
# can differ by several BFCL points, so they cannot share a bar.
#
# This file is deliberately OUTSIDE the closure hash (`taxon::configs` does not
# list it), so ratcheting a threshold does not invalidate the record that
# justified the ratchet.
#
# `status = "unmeasured"` entries carry NO [benchmarks.metrics] table. Absence
# is the TODO -- a guessed threshold a run could clear would report PASS for
# something nobody measured.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "Qwen/Qwen3.6-35B-A3B-FP8"
gate = "bfcl-subset-echolp"
recipe = "qwen3.6/qwen3.6-35b-a3b-fp8-bf16head"
default = true
status = "measured"
note = """\
RETIRING (2026-09-30, NVFP4-only gates): replaced by the \
nvidia/Qwen3.6-35B-A3B-NVFP4 entry below once it is measured on GB10; delete \
this entry in the commit that moves the default.

Gate B. Echolp draw (46/23/12, floor 25, n=1004, seed 42, temp 0) on the 35B MoE. THIS BENCH \
EXISTS BECAUSE THE 35B HAS NEVER BEEN RUN ON THE GOLDEN n=995 DRAW — every 35B BFCL number \
on record is this draw, so gating it on the golden one would have meant inventing a \
threshold. THRESHOLDS ARE THE HIGH-WATER RATCHET, NOT THE LIVE BASELINE. RATCHETED 2026-08-13 \
(owner instruction): overall 84.66 -> 86.50, normalized 83.32 -> 86.90. The old floors were \
set from the 2026-07-10 high-water (84.66/83.32) and were never re-raised after the gate \
started reproducing 86.95/86.55 bit-identically across many shas (2026-08-07..08-12, engine \
bitwise-deterministic at batch 1). Consequence: the 2026-08-12 batch4 stack shipped a \
-1.61/-1.79 deterministic regression (85.34/84.76, reproduced to the hundredth at 03a74eac19 \
and cb9f8ecab4 — the rerouted MoE router GEMM, see router_gate_gemm_dense) and PASSED with \
0.10 to spare. The new floors are best-ever minus 0.05: the gate compares value + noise >= \
min with noise = 0.4, so 86.50/86.90 fail anything below 86.10/86.50 — 0.45 under the \
86.55/86.95 best, outside the +/-0.4 MTP-nondeterminism band — while a healthy build \
reproducing the best-ever state passes with the full noise margin. Do not lower these \
silently; a conscious lowering needs a recorded reason here. The pre-2026-08 note recorded a \
then-unexplained -0.60/-1.26 live-baseline gap (2026-07-26, 84.06/82.06); the deterministic \
86.95/86.55 record since 2026-08-07 supersedes it. `noise` is the measured +/-0.4 \
MTP-nondeterminism band. Do NOT score this against the golden draw's numbers: same overall \
(~87.44 vs 87.45) but normalized differs ~1.8 points purely from category mix. History: \
2026-07-10 main-438ed09 84.66/83.32 (old high-water); 2026-07-13 d77bdf84 84.66/83.32; \
2026-07-26 main 22adb23e control 84.06/82.06; 2026-07-26 pr369 de6153f3 83.96/81.96; \
2026-08-03 PR #388 Gate B 84.26/82.15 n=1004; 2026-08-07..08-12 main 86.95/86.55 \
bit-reproduced (new high-water); 2026-08-12 03a74eac19 85.34/84.76 REGRESSION (batch4 \
stack); 2026-08-13 cb9f8ecab4 85.34/84.76 (identical — deterministic). The draw is PINNED \
at n=1004: a score from a different draw is not comparable to these thresholds, and the \
sample count is the only thing that reveals it after the fact, so it is gated exactly rather \
than merely recorded. Self-start pins ssm_cache_slots=256 via [benchmarks.serve_overrides] \
(the same override the poison gate uses) so a 1004-sample serial generate cannot evict its \
own Marconi snapshots; the flagship recipe leaves the pool at its default 16. That is \
capacity, not a score lever — the floors below stay the ratchet — but check_record demands \
the pin on the record, so records measured before the pin stop covering and the next gate \
run re-records under the declared config."""

[benchmarks.serve_overrides]
ssm_cache_slots = "256"

[benchmarks.metrics.normalized_single_turn_score]
min = 86.90
noise = 0.4

[benchmarks.metrics.overall_accuracy]
min = 86.50
noise = 0.4

[benchmarks.metrics.samples]
min = 1004
max = 1004

[[benchmarks]]
quant = "nvfp4"
checkpoint = "nvidia/Qwen3.6-35B-A3B-NVFP4"
gate = "bfcl-subset-echolp"
recipe = "qwen3.6/qwen3.6-35b-a3b-nvfp4"
default = false
status = "unmeasured"
note = "NVFP4 replacement for the retiring FP8 entry above (owner decision 2026-09-30: NVFP4-only gates). Unmeasured: thresholds follow the first GB10 run on main."

[benchmarks.serve_overrides]
ssm_cache_slots = "256"


# ── NVFP4-MoE VARIANT of the cold-TTFT guard ────────────────────────────────
# Declared beside the FP8 default because no gate anywhere exercised an NVFP4
# MoE checkpoint. That mattered — the fast-MoE default-on work (#654) is gated
# on `modelopt_mixed_precision || nvfp4_moe`, so it is INERT on FP8, and the
# whole 10-gate suite passed it while never touching the path it changed.
#
# `default = true` since 2026-09-30: the FP8 gate subjects were retired
# (NVFP4-only gates) and this entry is now the default subject.
#
# CEILINGS = same-box baseline (dgx1, 2026-08-21, this recipe) x the gate limits,
# derived exactly as the FP8 entries above are. Measured against a SELF-DRIVEN
# server, because the machinery deliberately refuses to let an unmeasured entry
# bootstrap itself: `status = "unmeasured"` entries are DROPPED rather than given
# empty thresholds, so `resolve()` fails loudly instead of an unbounded entry
# passing every check it is handed. A new variant is therefore always
# measure-then-declare, never gate-then-fill-in.
#   cold  median 442.3 ms  p90 1314.3 ms   (256/1024/4096 tok: 244.8 / 442.3 / 1310.7)
#   warm  median 439.6 ms  p90 1291.1 ms   (256/1024/4096 tok: 230.7 / 439.6 / 1290.9)
# TTFT is box-local — a different box must re-record these, not reuse them.
[[benchmarks]]
quant = "nvfp4"
checkpoint = "nvidia/Qwen3.6-35B-A3B-NVFP4"
gate = "ttft-cold-gate"
recipe = "qwen3.6/qwen3.6-35b-a3b-nvfp4"
default = true
status = "measured"
note = """\
Cold-TTFT guard for the NVFP4 MoE checkpoint — the path fast-MoE default-on \
actually changes, and which no gate exercised before this entry. Ceilings = \
dgx1 baseline 442.3 ms median x +3%, 1314.3 ms p90 x +5%."""

[benchmarks.metrics.median_ms]
max = 455.57

[benchmarks.metrics.p90_ms]
max = 1380.02



# ── NVFP4-MoE VARIANT of the warm-TTFT guard (see the cold note above) ──────
[[benchmarks]]
quant = "nvfp4"
checkpoint = "nvidia/Qwen3.6-35B-A3B-NVFP4"
gate = "ttft-warm-gate"
recipe = "qwen3.6/qwen3.6-35b-a3b-nvfp4"
default = true
status = "measured"
note = """\
Warm-TTFT guard for the NVFP4 MoE checkpoint. Ceilings = dgx1 baseline \
439.6 ms median x +3%, 1291.1 ms p90 x +5%."""

[benchmarks.metrics.median_ms]
max = 452.79

[benchmarks.metrics.p90_ms]
max = 1355.65



