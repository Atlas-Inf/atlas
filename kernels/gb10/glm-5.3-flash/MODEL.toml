[model]
name = "glm-5.3-flash"
hf_id = "nvidia/GLM-5.3-Flash-NVFP4"
params = "320B"
active_params = "18B"
architecture = "KDA + MLA (NoPE) + MoE + mHC"

layers_total = 45
layers_linear_attention = 34
layers_full_attention = 11
hidden_dim = 4096
head_dim = 256
q_heads = 64
kv_heads = 64
vocab_size = 154880
max_position_embeddings = 1048576

linear_attn_heads = 64
linear_attn_head_dim = 128
linear_conv_kernel = 4

moe_experts = 288
moe_topk = 8
moe_intermediate = 2048
shared_expert_intermediate = 2048

hc_mult = 4
hc_sinkhorn_iters = 20
hc_eps = 1e-6

[[model_types]]
model_type = "glm5_next"
hidden_size = 4096

[behavior]
thinking_default = false
thinking_in_tools = false
# Preserve native brief reasoning instead of imposing the generic A4 bias.
min_reasoning_floor_tokens = 0
tool_call_parser = "poolside_v1"
# Both loop guards off: they end legitimate repetitive output (counting
# "1, 2, 3, ..." trips the digit-normalized period-2 detector at 48 tokens;
# code with similar lines trips the stream's SimHash sentence guard), and
# GLM-5.3 has no observed degenerate-loop mode needing them. vLLM has neither.
enable_loop_watchdog = false
enable_stream_loop_guards = false
default_num_drafts = 0
default_kv_dtype = "bf16"

# These optional lookups were harvested from an EP=2 boot audit on two DGX
# Sparks. Both ranks reported the same 33 unresolved probes; the 2026-09-28
# port smoke added the moe_persist_marker, K16-tile and head-rank FP8 drafter
# probes. Each lookup is handle-gated or has a resolved fallback in the
# inherited DeepSeek kernel set; none is required by the default GLM-5.3 NVFP4
# execution path.

[expected_absent.inferspark_prefill_512tc]
inferspark_prefill_512tc = """
The wide-head helper probes the optional tensor-core HDIM=512 prefill kernel
because MLA exposes kv_lora_rank=512. This model uses the inherited scalar
inferspark_prefill_512 fallback, which resolves in the target kernel set."""

[expected_absent.moe_silu_mul]
silu_mul_quant_fp8 = """
The inherited target shadows the common moe_silu_mul module without this fused
FP8 helper. forward_prefill_fp8 gates the fused path on handle != 0 and uses the
resolved unfused SiLU and quantization kernels when it is absent."""

[expected_absent.moe_w4a16]
moe_w4a16_fused_gate_up_t_k64_fp4 = "Optional FUSED-FP4 gate/up arm; routed prefill checks the handle before dispatch and uses the resolved NVFP4 arm."
moe_w4a16_fused_gate_up_t_k64_m128 = "Optional M=128 Block-D arm; routed prefill checks the handle and falls through to the resolved M=64 arm."
moe_w4a16_down_t_k64_fp4 = "Optional FP4 down-projection arm; routed prefill checks the handle before dispatch and uses the resolved NVFP4 arm."

[expected_absent.moe_persist_marker]
moe_w4a16_k64_strides_m_tiles = "Capability marker issued by MoeLayer::new on every MoeLayer MoE model; only targets whose k64 prefill kernels were measured to stride m-tiles ship it (qwen3.8-flash-next). Absent here by design: handle 0 keeps the full m-tile grid."

[expected_absent.nvfp4_mmq]
atlas_nvfp4_mmq128_nc = """
Optional llama-style NVFP4 dense-FFN MMQ family. Initialization requires every
family handle and the ATLAS_FFN_NVFP4_MMQ opt-in; the inherited w4a16 NVFP4
prefill path is resolved and serves by default."""
atlas_nvfp4_mmq128_wc = "Same optional MMQ family; family-wide handle gate plus ATLAS_FFN_NVFP4_MMQ opt-in."
atlas_nvfp4_mmq16_nc = "Same optional MMQ family; family-wide handle gate plus ATLAS_FFN_NVFP4_MMQ opt-in."
atlas_nvfp4_mmq16_wc = "Same optional MMQ family; family-wide handle gate plus ATLAS_FFN_NVFP4_MMQ opt-in."
atlas_nvfp4_mmq32_nc = "Same optional MMQ family; family-wide handle gate plus ATLAS_FFN_NVFP4_MMQ opt-in."
atlas_nvfp4_mmq32_wc = "Same optional MMQ family; family-wide handle gate plus ATLAS_FFN_NVFP4_MMQ opt-in."
atlas_nvfp4_mmq64_nc = "Same optional MMQ family; family-wide handle gate plus ATLAS_FFN_NVFP4_MMQ opt-in."
atlas_nvfp4_mmq64_wc = "Same optional MMQ family; family-wide handle gate plus ATLAS_FFN_NVFP4_MMQ opt-in."
atlas_nvfp4_quantize_bf16 = "MMQ activation quantizer; used only when the complete optional MMQ family resolves and is enabled."
atlas_nvfp4_repack = "MMQ weight-repack helper; used only when the complete optional MMQ family resolves and is enabled."
atlas_nvfp4_scale_bf16 = "MMQ scale helper; used only when the complete optional MMQ family resolves and is enabled."
atlas_nvfp4_silu_mul_quant = "MMQ fused activation helper; used only when the complete optional MMQ family resolves and is enabled."
atlas_nvfp4_silu_mul_scaled = "MMQ fused activation helper; used only when the complete optional MMQ family resolves and is enabled."

[expected_absent.q4k_mmq]
atlas_q4k_mmq128_nc = """
Optional Q4_K dense-FFN MMQ family. Initialization requires all family handles
and ATLAS_FFN_MMQ; GLM-5.3 uses the resolved NVFP4 path instead."""
atlas_q4k_mmq128_wc = "Same optional Q4_K family; family-wide handle gate plus ATLAS_FFN_MMQ opt-in."
atlas_q8_1_quantize_ds4_bf16 = "Q4_K activation helper; used only when the complete optional Q4_K family resolves and is enabled."

[expected_absent.q4k_quantize]
q4k_quantize = "Q4_K weight helper; used only when the complete optional Q4_K family resolves and is enabled."

[expected_absent.w4a16]
fp8_gemm_t_row_scaled = "Optional FP8 drafter probe (DFlash head, rank 0 only); used only under ATLAS_DFLASH_DRAFTER_FP8, which GLM does not set. The GLM drafter runs its BF16/MXFP8/NVFP4 paths when this handle is absent."
fp8_gemm_t_row_scaled_m16 = "Optional small-M FP8 drafter lm_head twin; same ATLAS_DFLASH_DRAFTER_FP8 gate, unused on GLM."
int8_gemm_faith2 = "Optional lossy W4A8 prefill arm; dispatch requires both a nonzero handle and ATLAS_INT8_PREFILL."
int8_gemm_i32acc = "Optional W4A8 accumulator arm; dispatch requires both a nonzero handle and ATLAS_INT8_PREFILL."
requant_a_bf16_int8 = "Activation helper for the optional ATLAS_INT8_PREFILL family; never materialized when its GEMM handles are absent."
requant_w_nvfp4_int8 = "Weight helper for the optional ATLAS_INT8_PREFILL family; never materialized when its GEMM handles are absent."
w4a16_gemm_t_k64_n64_p3 = "Optional narrow-N deep-pipeline arm; attention dispatch checks handle != 0 before use."
w4a16_gemm_t_k64_p3 = "Optional deep-pipeline arm; k64_kernel falls back to the resolved w4a16_gemm_t_k64 kernel."
w4a16_gemm_t_m128_bf16 = "Optional BF16 projection prefill arm; dispatch checks handle != 0 and falls back through the resolved m128 path."
w4a16_gemm_t_m128_bf16_v2 = "Optional second-generation BF16 projection arm; dispatch checks handle != 0 and falls back through the resolved m128 path."
w4a16_gemm_t_m128_k16 = "Optional K16-tile A/B arm; dense FFN dispatch requires a nonzero handle and ATLAS_W4A16_K16, otherwise the resolved m128 path serves."
w4a16_gemm_t_p3 = "Optional deep-pipeline arm; tgemm_kernel falls back to the resolved w4a16_gemm_t kernel."

[expected_absent.w4a4]
w4a4_gemm = "Optional dense-FFN native-FP4 prefill arm; dispatch requires a nonzero handle and ATLAS_FP4_PREFILL."
