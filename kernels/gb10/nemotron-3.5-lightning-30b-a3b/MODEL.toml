[model]
name = "nemotron-3.5-lightning-30b-a3b"
hf_id = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
model_type = "nemotron_h"
architecture = "hybrid_mamba2_moe_attention_mtp"
parameters = "30B"
active_parameters = "3B"

[[model_types]]
model_type = "nemotron_h"
hidden_size = 2688
# Lightning adds num_nextn_predict_layers=1 and mtp.* tensors.
# Same 2688 hidden as Nano so Nano SM121 kernels bind.

[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.non_thinking]
temperature = 0.7
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.tools]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[behavior]
use_sampling_presets_for_core = true
thinking_in_tools = true
max_thinking_budget = 8192
# Official Lightning template defaults enable_thinking=true. Thinking-off
# emits empty <think></think> and this checkpoint then copies the first
# operand (7+5 → 7). Thinking-on ChatML math is correct (12).
thinking_default = true
cap_thinking_at_max_tokens = false
default_system_prompt = "You are a helpful assistant."
jinja_template = "nemotron_lightning.jinja"
rollback_resteer = false
default_num_drafts = 1

# Official Lightning DSpark (Qwen3DSpark, 6-layer, Markov-only).
# Weights stay on the host; pass --dflash --draft-model <local-or-hf>.
[dflash]
draft_model = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-DSpark"
gamma = 8
window_size = 1024
mask_token_id = 990
target_layer_ids = [1, 5, 19, 29, 41, 51]
