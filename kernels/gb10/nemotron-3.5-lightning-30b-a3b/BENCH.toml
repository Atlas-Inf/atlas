[[benchmarks]]
quant = "nvfp4"
checkpoint = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
gate = "concurrency-sweep"
recipe = "nemotron-3.5-lightning/nemotron-3.5-lightning-30b-a3b-nvfp4-dspark"
label = "Nemotron-3.5-Lightning-30B-A3B (NVFP4 + DSpark)"
default = false
status = "measured"
note = """\
The C=1..32 ladder. ★ THE RECIPE'S `gpu_memory_utilization: 0.80` IS LOAD- \
BEARING FOR THIS GATE AND IS NOT A TUNING KNOB. Measured on a GB10 (119 GB \
unified) 2026-08-26: at 0.88 the box has ~6 GB of host memory left once the \
model is resident and concurrency 8 exhausts it between consecutive samples of \
a 2-second poll — 6.4 GB to 180 MB — taking the machine off the network \
entirely, with no reboot. At 0.80 the post-load headroom is ~15.8 GB and the \
1/2/4/6/8 ladder completes with zero failed requests: 76.1 / 95.8 / 120.6 / \
104.1 / 140.3 aggregate tok/s, 1.84x at C8, 17.6 tok/s per client. That is a \
CLIFF, not a gradient. Run this sweep behind a host-memory watchdog that kills \
the BENCH — never the server — when MemAvailable drops below ~1.2 GB, and do \
not raise the utilisation without re-measuring. The dip at C=6 reproduces and \
is unexplained; it fails nothing. Those numbers came from an ad-hoc ladder, \
not from this gate, so they are context for whoever reads the first record — \
not a threshold, and not a baseline. \
★ MEASURED 2026-09-01 ON THIS GATE, 24 cells (ISL 128/512/1024/2048 x C \
1/2/4/8/16/32), verdict `Info: 24 cells, no request errors, all above the \
vacuity floor`. The shape, at ISL 128: TTFT p50 600 ms -> 4.42 s -> 41.1 s at \
C=1 -> 8 -> 32, TPOT p50 12.4 -> 114.1 -> 120.6 ms, and SERVER decode flat at \
58.5 -> 52.8 -> 53.3 tok/s. Read that carefully: the table's `tok/s` column is \
the server-side decode rate, not aggregate throughput, so its peak at C=1 is \
arithmetic and not a scaling failure. Decode rate is flat across every rung and \
every ISL while TTFT degrades ~68x, which is what `max_batch_size: 8` predicts - \
at C=16 and C=32 requests are QUEUEING, not batching. Still no thresholds: this \
gate is not required and a curve is not a bound. \
★ MEASURED 2026-09-01 ON THE CORRECTED TEMPLATE, and it reproduces the \
pre-fix run closely enough to trust: 24/24 cells, ZERO request errors, peak \
60.0 tok/s at concurrency 2, best TTFT p50 506 ms. Aggregate throughput is \
FLAT across the ladder - 59.9 / 60.0 / 55.8 / 51.8 / 54.4 / 51.8 tok/s at \
C=1..32 on ISL 128 - while TTFT p50 degrades 506 ms to 38.7 s over the same \
range, about 76x. That is what max_batch_size 8 predicts: past 8 the rungs \
queue, so added concurrency buys latency, not throughput. Longer inputs shift \
the whole curve down (36.4 tok/s at C=1 on ISL 2048) without changing its \
shape. \
★ THE PERF LEG TURNED OUT TO BE TEMPLATE-INSENSITIVE. Before/after the \
template fix: ttft-cold 905.2 -> 905.5 ms median, ttft-warm 900.8 -> 904.2, \
sweep throughput 48-58 -> 51.8-60 tok/s. That is the expected result once \
stated plainly - these probes pin the output length, and the template changes \
GENERATION, not prefill or token count. Only the accuracy leg (ST-995, 11.26 \
-> 64.22) was destroyed by it. Do not generalise "the wrong template \
invalidated the measurements" to the speed numbers; it did not. \
★ THE BOUND BELOW IS A BLOWUP DETECTOR, not a perf gate. c1_aggregate_tok_s \
is floored well under the THREE agreeing measurements so a real collapse trips \
it and ordinary variance does not. \
★ THIRD RUN 2026-09-02, the same logprobs-patch regression check the TTFT legs \
got. 24/24 cells, zero request errors, every cell above the vacuity floor. \
Peak 60.1 tok/s at C=2, best TTFT p50 509 ms, c1_aggregate_tok_s 59.8. The \
ISL-128 ladder reads 59.8 / 60.1 / 56.0 / 52.7 / 52.5 / 51.8 tok/s at C=1..32 \
against the previous 59.9 / 60.0 / 55.8 / 51.8 / 54.4 / 51.8, and ISL 2048 at \
C=1 lands on 36.4 tok/s in both runs. Two independent measurements agreeing to \
a tenth at the anchor cell is what makes the 50.0 floor a defensible blowup \
detector rather than a guess off one sample. \
★ THE QUEUEING STORY IS NOW VISIBLE IN THE EVIDENCE LINES, not just inferred \
from max_batch_size 8. At ISL 2048 / C=32 the SERVER reports ttft p50 1461 ms \
and decode p50 4.0 tok/s while the CLIENT sees ttft p50 74.4 s: the server is \
timing only the requests it has admitted, so the ~73 s difference is queue \
wait, not prefill. Read the client column for user-visible latency and the \
server column for engine health; on this recipe past C=8 they answer different \
questions."""

[benchmarks.metrics.c1_aggregate_tok_s]
min = 50.0
noise = 1.0


# ── A promotion candidate, run because this port is the reason it exists ────
[[benchmarks]]
quant = "nvfp4"
checkpoint = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
gate = "cross-contamination"
recipe = "nemotron-3.5-lightning/nemotron-3.5-lightning-30b-a3b-nvfp4-dspark"
label = "Nemotron-3.5-Lightning-30B-A3B (NVFP4 + DSpark)"
# `true` because this is the ONLY checkpoint declaring this gate anywhere in
# kernels/, so it is the default by arithmetic rather than by preference. Left
# `false` the baseline would assemble with no default at all, and a gate run
# that omits `--checkpoint` refuses on "no default checkpoint" — a landmine
# that would only go off the day cross-contamination graduates out of
# PROMOTION_CANDIDATES. The same reason mlperf-agentic-subset, also
# non-required and also sole-declarer, sets it.
default = true
status = "measured"
note = """\
NOT one of the ten REQUIRED_GATES - `cross-contamination` sits in \
PROMOTION_CANDIDATES, whose own doc comment asks for exactly this: a candidate \
"run on release cuts and recorded as debt until it has proven itself". \
Declaring it here neither creates nor discharges a gate obligation; the \
required set is a fixed array of ten in gate/mod.rs and does not read this \
file. It is recorded because the result is evidence, not because anything \
demanded it. \
★ WHY THIS PORT IN PARTICULAR. Every request on this recipe shares one \
`--ssm-cache-slots 256` pool, and DFlash makes each of them roll back SSM \
state on every rejected draft. That is a concurrent-mutation shape, and the \
question "does one request's rollback corrupt another's state" is not answered \
by the single-stream equivalence test recorded on the poisoning entry below. \
★ MEASURED 2026-09-02, same box, same binary, same recipe: 2 prompts x rungs \
C=2/4/8 plus a post-check, 8 comparisons, 8/8 byte-identical to their solo \
reference over 2048 compared tokens. contaminated 0, diverged 0, persistent 0, \
alone_unstable 0, unmeasured 0. Verdict Pass. \
★ READ THE POST-CHECK ROW AS THE INTERESTING ONE. `A post` and `B post` re-run \
each probe ALONE after the concurrent rungs; identical there is the statement \
that concurrency left no residue in the shared pool - a transient interference \
would show in the C=8 rows, whereas a permanently damaged slot shows only \
here. Both are clean. \
★ WHAT IT DOES NOT COVER. Two prompts at C<=8 (the recipe's max_batch_size), \
short generations, prefix caching off. It says nothing about restore-from- \
snapshot poisoning, which is the separate hazard the entry below is about, and \
nothing above C=8 where the sweep shows requests queue rather than batch.\
"""

[benchmarks.metrics.contaminated]
# Zero-tolerance, all three. These are not rates with a noise band - a single
# contaminated, diverged or persistently-damaged stream is a correctness bug on
# a shared-state engine, so the bound is exact and `noise` is deliberately absent.
max = 0.0

[benchmarks.metrics.diverged]
max = 0.0

[benchmarks.metrics.persistent]
max = 0.0

[benchmarks.metrics.identical]
# Pin the low end too, so a run that compared nothing cannot pass on three
# zeroes: 8 comparisons is what 2 prompts x 3 rungs + 2 post-checks produces.
min = 8.0


# ── The correctness gate the DSpark verify path most needs ──────────────────
[[benchmarks]]
quant = "nvfp4"
checkpoint = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
gate = "ssm-state-poisoning-gate"
recipe = "nemotron-3.5-lightning/nemotron-3.5-lightning-30b-a3b-nvfp4-dspark"
label = "Nemotron-3.5-Lightning-30B-A3B (NVFP4 + DSpark)"
default = false
status = "unmeasured"
note = """\
Declared because this port has a specific reason to fear it, not because the \
set looked incomplete. The merge that brought DSpark here combined two \
rollback implementations in `verify_a.rs` / `async_chkpt.rs`: upstream's \
`ssm_pool.h_stored_bytes` for h_bytes with the ported \
`config.ssm_conv_state_bytes()` for conv_bytes — because the GDN formula \
(nk*kd*2 + nv*vd) evaluates to 0 on a Nemotron-H backbone, which left LIVE SSM \
state behind on rejected drafts. A speculative decoder that fails to roll back \
recurrent state is precisely what this gate detects, and it detects it as \
byte-difference in a replayed conversation rather than as a wrong number. \
`collapsed` and `unmeasured` take zero tolerance when thresholds are set; \
`jittered` must NOT be bounded, because restore-anchor selection varies \
between rounds on a healthy engine. \
★ ATTEMPTED 2026-09-01 AND IT COULD NOT EVALUATE THIS CHECKPOINT AT ALL. The \
gate failed on its REFERENCE round, not on a replay: \
`reference round failed the script anchors (turn 2: line 1 does not start with \
its number ...) - replays compared against it would certify nothing`. NOTHING \
ABOUT SSM POISONING WAS TESTED - not a pass, not a failure of the rollback \
path; the gate could not run. \
\
TWO SEPARATE CAUSES, established 2026-09-01, and only the first is fixed. \
\
(1) THE REFERENCE FORMAT. `probe.rs` documents this exact failure mode: with \
thinking ON the gate 'burns the token budget then truncates turns 2-3 \
(finish_reason=length) and over-produces (turn 2 gave 5 numbered lines, not \
3)'. That is what was observed. It is compounded by the template bug fixed in \
this branch - the run used `nemotron_h.jinja` instead of the declared \
`nemotron_lightning.jinja`, which seeds an OPEN <think> block, so the model \
could not emit terse numbered lines even in principle. The canonical fix is \
the one qwen3.6-35b-a3b already uses: `--serve-override disable_thinking=true` \
(NOT per-request chat_template_kwargs). RE-ATTEMPT after the template fix with \
that override before concluding anything about the format. \
\
(2) THE VACUITY BLOCKER, WHICH IS NOT FIXED AND IS NOT FIXABLE HERE. This gate \
detects poisoning as a byte-difference between REPLAYS THAT RESTORE FROM A \
MARCONI PREFIX-CACHE SNAPSHOT; `probe.rs` sizes LONG_PREFIX specifically so \
'every later round's prefill lands as a prefix-cache restore', and \
qwen3.6-35b-a3b bounds `min_cached_prompt_tokens` as its VACUITY ATTESTATION. \
This recipe pins `enable_prefix_caching: false` - deliberately, against the \
SM12.x DFlash multi-turn correctness regression - so every round is cache-cold, \
`min_cached_prompt_tokens` is 0, and there is no restore to poison. Bound that \
metric when thresholds are set here: without it the gate would read GREEN off \
twelve trivially-identical cold rounds, which is worse than the red it reads \
today. \
\
WHAT THIS DOES NOT EXCUSE. The conv_bytes=0 rollback hazard above is a \
WITHIN-GENERATION defect - live SSM state surviving a rejected draft - and it \
does not need prefix caching to manifest. Disabling the cache removes this \
gate's detection mechanism, NOT the hazard. The instrument that does reach it \
without a cache is greedy output-equivalence: with greedy verification a \
correct speculative decoder is exactly output-preserving, so `--dflash` on vs \
off at temperature 0 must be token-identical, and a failed rollback shows up \
as divergence. Run that before treating the rollback path as exercised. \
★ THAT TEST HAS NOW RUN, AND IT PASSES. 2026-09-01, same box, same recipe, \
same binary, temperature 0, 12 prompts, ARM A `--dflash` (mtp=true, \
num_drafts=3 - the shipped gamma=4 contract, confirmed on the scheduler line) \
against ARM B speculation off (mtp=false, num_drafts=0): \
EXACT TOKEN-SEQUENCE MATCH 12/12. Greedy speculative decoding is \
output-preserving on this port, which is the strongest statement available \
about the rollback path and it is a bit-exact one. \
★ AND THE DISTRIBUTIONS AGREE, not just the tokens. 1419 scored positions: \
88.5% bit-identical top-5, 93.5% sharing the same top-5 support, and on those \
the top-k restricted KL(A||B) has mean 1.2e-17 and max 3.8e-15 - machine \
epsilon, i.e. the two decode paths are the same distribution. The remaining \
6.5% differ only in WHICH token holds the 5th slot (a tie flipping membership); \
their apparent KL up to 29.96 is entirely the estimator's absent-token floor \
and means nothing. The one real raw difference is a CONSTANT offset in the log \
normaliser - at the worst position all five deltas are -0.018286 with spread \
1e-7 - and KL is invariant to a constant offset, which is exactly why the \
same-support KL is zero. \
★ WHAT THIS DOES AND DOES NOT SETTLE. It exercises the conv_bytes=0 rollback \
hazard directly, without needing the prefix cache, and finds no corruption: \
live SSM state surviving a rejected draft would move the emitted tokens, and \
they do not move. It does NOT replace this gate: 12 short greedy prompts are \
not 12 replayed multi-turn conversations restoring from Marconi snapshots, and \
a poisoned RESTORE is a different failure than a poisoned ROLLBACK. Keep this \
entry unmeasured; the equivalence result is evidence about the port, not a \
substitute for the gate. \
★ AND THE GATE HAS NOW BEEN RUN, 2026-09-02, instead of only reasoned about - \
which was worth doing, because it fails EARLIER than this entry predicted and \
for a reason nothing above anticipated. It never reaches a replay comparison at \
all. It fails in the REFERENCE round, on the script anchors: `turn 2: line 1 \
does not start with its number: "Monotonic sequence: each record number exactly \
one greater than predecessor, gaps treated as corruption."` (likewise lines 2 \
and 3), and stops with `replays compared against it would certify nothing`. \
★ READ WHAT THAT ACTUALLY SAYS ABOUT THE MODEL, because it is not a defect. \
probe.rs requires turn 2 to be exactly three non-empty lines, each beginning \
with its own numeral (`line.starts_with("1")`, `"2"`, `"3"`). This checkpoint \
produced EXACTLY THREE LINES carrying EXACTLY THE THREE REQUIRED CONCEPTS - \
monotonic sequence, bounded drift, closed membership - and simply did not \
prefix them with numerals. It passed the count check and failed the format \
check. The anchor is calibrated to another model's output habits, the same way \
decode-floor's 750-token floor is calibrated to Qwen3.8-27B's deterministic \
915-token stop. Two of the ten required gates are therefore FIXTURE-BOUND: they \
cannot certify a checkpoint whose formatting differs from the one they were \
built on, however healthy the engine underneath. \
★ THE GATE IS BEHAVING CORRECTLY AND SHOULD NOT BE LOOSENED HERE. Refusing to \
certify off an unvalidated reference is fail-closed, which is the whole design; \
relaxing the anchor to accept unnumbered lines would weaken the check for every \
target that currently passes it, and that is a maintainer's decision on the \
fixture, not a porting change to smuggle into this branch. \
★ SO THERE ARE NOW TWO STACKED BLOCKERS, not one. Even with the anchors \
satisfied, the run announces `12 replay rounds, prefix caching under test` while \
this recipe pins `enable_prefix_caching: false` against the SM12.x DFlash \
correctness regression - so the replays would be twelve cold rounds, trivially \
identical, and the entry would read GREEN having detected nothing. The anchor \
failure is the nearer blocker; the caching pin is the deeper one. The entry \
stays unmeasured on both counts."""
