label = "Nemotron-3.5-Lightning-30B-A3B (NVFP4 + DSpark)"
default = false
status = "measured"
note = """\
The C=1..32 ladder. ★ THE RECIPE'S `gpu_memory_utilization: 0.80` IS LOAD- \
BEARING FOR THIS GATE AND IS NOT A TUNING KNOB. Measured on a GB10 (119 GB \
unified) 2026-08-26: at 0.88 the box has ~6 GB of host memory left once the \
model is resident and concurrency 8 exhausts it between consecutive samples of \
a 2-second poll — 6.4 GB to 180 MB — taking the machine off the network \
entirely, with no reboot. At 0.80 the post-load headroom is ~15.8 GB and the \
1/2/4/6/8 ladder completes with zero failed requests: 76.1 / 95.8 / 120.6 / \
104.1 / 140.3 aggregate tok/s, 1.84x at C8, 17.6 tok/s per client. That is a \
CLIFF, not a gradient. Run this sweep behind a host-memory watchdog that kills \
the BENCH — never the server — when MemAvailable drops below ~1.2 GB, and do \
not raise the utilisation without re-measuring. The dip at C=6 reproduces and \
is unexplained; it fails nothing. Those numbers came from an ad-hoc ladder, \
not from this gate, so they are context for whoever reads the first record — \
not a threshold, and not a baseline. \
★ MEASURED 2026-09-01 ON THIS GATE, 24 cells (ISL 128/512/1024/2048 x C \
1/2/4/8/16/32), verdict `Info: 24 cells, no request errors, all above the \
vacuity floor`. The shape, at ISL 128: TTFT p50 600 ms -> 4.42 s -> 41.1 s at \
C=1 -> 8 -> 32, TPOT p50 12.4 -> 114.1 -> 120.6 ms, and SERVER decode flat at \
58.5 -> 52.8 -> 53.3 tok/s. Read that carefully: the table's `tok/s` column is \
the server-side decode rate, not aggregate throughput, so its peak at C=1 is \
arithmetic and not a scaling failure. Decode rate is flat across every rung and \
every ISL while TTFT degrades ~68x, which is what `max_batch_size: 8` predicts - \
at C=16 and C=32 requests are QUEUEING, not batching. Still no thresholds: this \
gate is not required and a curve is not a bound. \
★ MEASURED 2026-09-01 ON THE CORRECTED TEMPLATE, and it reproduces the \
pre-fix run closely enough to trust: 24/24 cells, ZERO request errors, peak \
60.0 tok/s at concurrency 2, best TTFT p50 506 ms. Aggregate throughput is \
FLAT across the ladder - 59.9 / 60.0 / 55.8 / 51.8 / 54.4 / 51.8 tok/s at \
C=1..32 on ISL 128 - while TTFT p50 degrades 506 ms to 38.7 s over the same \
range, about 76x. That is what max_batch_size 8 predicts: past 8 the rungs \
queue, so added concurrency buys latency, not throughput. Longer inputs shift \
the whole curve down (36.4 tok/s at C=1 on ISL 2048) without changing its \
shape. \
★ THE PERF LEG TURNED OUT TO BE TEMPLATE-INSENSITIVE. Before/after the \
template fix: ttft-cold 905.2 -> 905.5 ms median, ttft-warm 900.8 -> 904.2, \
sweep throughput 48-58 -> 51.8-60 tok/s. That is the expected result once \
stated plainly - these probes pin the output length, and the template changes \
GENERATION, not prefill or token count. Only the accuracy leg (ST-995, 11.26 \
-> 64.22) was destroyed by it. Do not generalise "the wrong template \
invalidated the measurements" to the speed numbers; it did not. \
★ THE BOUND BELOW IS A BLOWUP DETECTOR, not a perf gate. c1_aggregate_tok_s \
is floored well under the THREE agreeing measurements so a real collapse trips \
it and ordinary variance does not. \
★ THIRD RUN 2026-09-02, the same logprobs-patch regression check the TTFT legs \
got. 24/24 cells, zero request errors, every cell above the vacuity floor. \
Peak 60.1 tok/s at C=2, best TTFT p50 509 ms, c1_aggregate_tok_s 59.8. The \
ISL-128 ladder reads 59.8 / 60.1 / 56.0 / 52.7 / 52.5 / 51.8 tok/s at C=1..32 \
against the previous 59.9 / 60.0 / 55.8 / 51.8 / 54.4 / 51.8, and ISL 2048 at \
C=1 lands on 36.4 tok/s in both runs. Two independent measurements agreeing to \
a tenth at the anchor cell is what makes the 50.0 floor a defensible blowup \
detector rather than a guess off one sample. \
★ THE QUEUEING STORY IS NOW VISIBLE IN THE EVIDENCE LINES, not just inferred \
from max_batch_size 8. At ISL 2048 / C=32 the SERVER reports ttft p50 1461 ms \
and decode p50 4.0 tok/s while the CLIENT sees ttft p50 74.4 s: the server is \
timing only the requests it has admitted, so the ~73 s difference is queue \
wait, not prefill. Read the client column for user-visible latency and the \
server column for engine health; on this recipe past C=8 they answer different \
