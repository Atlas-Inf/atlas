[expected_absent.q4k_mmq]
atlas_q4k_mmq128_nc = "Q4_K MMQ gate/up prefill arm; ATLAS_FFN_MMQ env-gated AND requires q4k weights materialized from NVFP4 (dense_ffn.rs:466). Off in the recipe; w4a16 t_m128 serves prefill."
atlas_q4k_mmq128_wc = "Weight-column twin of the above; same gate, same fallback."
atlas_q8_1_quantize_ds4_bf16 = "Q8_1 activation requant for the Q4_K MMQ path; same ATLAS_FFN_MMQ gate."

[expected_absent.q4k_quantize]
