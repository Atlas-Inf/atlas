# gate/up/down fall back to the resolved w4a16 t_m128 path. This IS a
# performance gap on Windows prefill, declared not hidden: porting this
# family (or an FP8 equivalent, cf. commit 8eedc21cb's n_m128 arm) is the
# tracked prefill lever.
