[expected_absent.q2_0_gemv_vec]
q2_0_gemv_vec = "Q2_0 GGUF decode GEMV; q2_weights is None on this checkpoint — dtype-gated dead handle."
q2_0_gemv_vec_batchm = "batched twin; same dtype gate."

[expected_absent.w4a4]
w4a4_gemm = "W4A4 prefill GEMM; ATLAS_ATTN_W4A4 opt-in, handle!=0 gate. Resolved w4a16 arms serve."
