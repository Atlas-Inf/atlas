# Benchmarks for this model, and the thresholds its gate records must meet.
#
# Sibling of MODEL.toml so the numbers sit beside the thing they describe;
# hardware and model are implied by the path and cannot disagree with the
# contents. Read by `atlas_plugin::gate::bench`.
#
# Thresholds are per CHECKPOINT, not per model. This file scaffolds the
# nvidia/Qwen3.8-Flash-Next-NVFP4 checkpoint on Windows Strix Halo gfx1151.
#
# This file is deliberately OUTSIDE the closure hash, so ratcheting a threshold
# does not invalidate the record that justified the ratchet.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "nvidia/Qwen3.8-Flash-Next-NVFP4"
gate = "bfcl-subset"
label = "Qwen3.8-Flash-Next (NVFP4, nvidia) — Windows 11 Strix Halo gfx1151"
default = true
# First labelled observation, recorded without floors: the gate self-start
# resolves `recipe` from atlas-recipes and no recipe can express this serve
# (scripts/strix-windows/win_serve_flashnext_nvfp4.ps1 with its env pins), so
# `measured` would fail the resolvable-recipe check — same demotion as the
# strix-hip qwen3.8-27b entries. Restore "measured" with floors (samples
# pinned 995, overall_accuracy min 81.81 noise 0.4,
# normalized_single_turn_score min 82.00 noise 0.4) when a recipe exists.
status = "unmeasured"
