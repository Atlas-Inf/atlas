# Qwen3.8-Flash-Next NVFP4 — strix-hip (gfx1151, native HIP) shadow of the
# gb10/qwen3.8-flash-next target.
#
# .cu overrides in this dir (relative symlinks): hyper_connection, ple and
# qsa_indexer come from the gb10 Flash-Next shadow; gated_delta_rule_wy17 from
# gb10/qwen3.6-35b-a3b; moe_w4a16_grouped_gemm and w4a16_gemm are the strix-hip
# HIP ports (qwen3.6-27b / qwen3.6-35b-a3b); gated_delta_rule and
# vision_encoder mirror the strix-hip qwen3.6-35b-a3b choices. Everything else
# is inherited from kernels/strix-hip/common/.
#
# Module map: identical to strix-hip/qwen3.6-35b-a3b's — the runtime kernel
# registry resolves functions by these module names regardless of backend.
# None of the extra module aliases in gb10/qwen3.8-flash-next's KERNEL.toml
# (turbo/bf16k/fp8k paged-decode variants, wht_bf16, tq_plus_innerq_apply) are
# carried over: those .cu files do not exist on strix-hip.

[build]
# SCALE is clang-19 based: nvcc's `--fmad=false` is spelled `-ffp-contract=off`.
# Same numerical intent (no FP multiply-add contraction) as the gb10 target,
# which matters for NVFP4/FP8 precision parity.
#
extra_nvcc_flags = ["-ffp-contract=off"]

# File stem → module name overrides. MUST stay identical to the gb10
# qwen3.6-27b/nvfp4 KERNEL.toml — the runtime kernel registry resolves
# functions by these module names regardless of backend.
[modules]
e2m1_branchless = "e2m1"
moe_permute = "moe"
dense_gemm_bf16 = "gemm"
rms_norm = "norm"
argmax_bf16 = "argmax"
dense_gemv_bf16 = "gemv"
dense_gemv_fp8w = "gemv_fp8w"
moe_shared_expert_fused_batch2 = "moe_fused_batch2"
moe_shared_expert_fused_batch3 = "moe_fused_batch3"
quantize_bf16_to_nvfp4 = "quantize_nvfp4"
paged_decode_attn = "paged_decode"
paged_decode_attn_fp8 = "paged_decode_fp8"
paged_decode_attn_nvfp4 = "paged_decode_nvfp4"
w4a16_gemm = "w4a16"
kv_cache_append = "kv_cache"
moe_w4a16_grouped_gemm = "moe_w4a16"
moe_sorted_prefill = "moe_sorted"
inferspark_prefill_paged = "prefill_paged"
inferspark_prefill_paged_fp8 = "prefill_paged_fp8"
inferspark_prefill_paged_nvfp4 = "prefill_paged_nvfp4"
reshape_and_cache_turbo = "reshape_and_cache_turbo"
paged_decode_attn_turbo4 = "paged_decode_turbo4"
paged_decode_attn_turbo8 = "paged_decode_turbo8"
paged_decode_attn_turbo4_512 = "paged_decode_turbo4_512"
paged_decode_attn_turbo8_512 = "paged_decode_turbo8_512"
paged_decode_attn_turbo3 = "paged_decode_turbo3"
paged_decode_attn_turbo3_128 = "paged_decode_turbo3_128"
paged_decode_attn_turbo4_128 = "paged_decode_turbo4_128"
paged_decode_attn_turbo8_128 = "paged_decode_turbo8_128"
inferspark_prefill_fp8kv = "prefill_fp8kv"
gated_delta_rule = "gated_delta_rule"
