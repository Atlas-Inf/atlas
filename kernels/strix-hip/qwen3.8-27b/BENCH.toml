simple_python 95.97). \
★ THE PYTHON/JS CLIFF REPRODUCES THE GB10 ANOMALY: simple_python 95.97 \
against simple_java 46.77 and simple_javascript 25.81 — the same split the \
gb10 entry calls "a defect in the serve path, with the chat-template change \
the prime suspect", here on different hardware, the same checkpoint, and the \
preservation load path. It is the largest known accuracy lever (~2 points of \
overall) and is NOT fixed by this baseline. \
★ THE BARS BELOW ARE REGRESSION FLOORS cut at measured-minus-noise (0.4, the \
documented MTP-nondeterminism band), not a quality endorsement: normalized \
