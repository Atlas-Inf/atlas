# SPDX-License-Identifier: AGPL-3.0-only
#
# Strix Halo (gfx1151) jobs on AMD's DevLab Dispatch pool: ephemeral
# self-hosted runners, one fresh runner per job, selected by the
# `devlab-dispatch` label (the pool matches on labels only, not runner groups).
#
# OWNER-ONLY BY CONSTRUCTION. This is AMD's hardware running our code, so the
# workflow has exactly one trigger, `workflow_dispatch`, and the `authorize`
# job refuses any actor other than the repository owner. There is no
# `pull_request` / `pull_request_target` trigger, so a fork PR cannot reach the
# pool at all, and nothing here reads a secret.
#
# Advisory, not gating: no required check depends on this workflow.
#
# Pool facts this file relies on (from other repos' use of the pool, 2026-09/10):
# - labels: [self-hosted, Linux|Windows, devlab-dispatch, strix-halo]
# - $HOME is a ~32 GB tmpfs overlay; durable space is under $RUNNER_TOOL_CACHE,
#   which is where the toolchain cache below lives.
# - jobs can queue for a long time when the pool is busy, so this workflow
#   never cancels an in-flight run (`cancel-in-progress: false`).

name: DevLab Strix (owner-only)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to check out"
        required: false
        default: main
        type: string
      job:
        description: "probe = env only; build = probe + native build; validate = build + unit slice + smoke; eval = model serve gates on a home-runner box"
        required: true
        default: probe
        type: choice
        options: [probe, build, validate, eval]
      model:
        description: "eval only: model id to serve"
        required: false
        default: "nvidia/Qwen3.8-27B-NVFP4"
        type: string
      legs:
        description: "eval only: space-separated gate legs (subtest identity nemotron st995 perf)"
        required: false
        default: "identity nemotron"
        type: string

permissions:
  contents: read

concurrency:
  group: devlab-strix-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize (owner only)
    if: github.repository == 'Atlas-Inf/atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the repository owner
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          for a in "$ACTOR" "$TRIGGERING_ACTOR"; do
            if [ "$a" != "AzeezIsh" ]; then
              echo "::error::DevLab Strix jobs are owner-only (got: $a)."
              exit 1
            fi
          done
          echo "Authorized: $ACTOR"

  strix-linux:
    name: Strix Halo Linux (${{ inputs.job }})
    needs: authorize
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Probe runner environment
        shell: bash
        run: |
          set -u
          {
            echo "## Strix Halo runner probe"
            echo '```'
            echo "host:    $(hostname)   kernel: $(uname -r)   cpus: $(nproc)"
            grep -m1 PRETTY_NAME /etc/os-release || true
            echo "rocm:    $(cat /opt/rocm/.info/version 2>/dev/null || echo 'no /opt/rocm/.info/version')"
            echo "hipcc:   $(command -v hipcc || ls /opt/rocm/bin/hipcc 2>/dev/null || echo missing)"
            (hipcc --version 2>/dev/null || /opt/rocm/bin/hipcc --version 2>/dev/null) | head -3 || true
            echo "kfd:     $( [ -r /dev/kfd ] && [ -w /dev/kfd ] && echo rw || echo NOT-accessible)"
            (rocminfo 2>/dev/null || /opt/rocm/bin/rocminfo 2>/dev/null) | grep -m2 -E 'Name:\s+gfx' || echo "rocminfo: no gfx agent visible"
            for d in /sys/class/drm/card*/device; do
              [ -r "$d/mem_info_vram_total" ] || continue
              echo "$d: vram=$(( $(cat $d/mem_info_vram_total) / 1073741824 )) GiB gtt=$(( $(cat $d/mem_info_gtt_total) / 1073741824 )) GiB"
            done
            free -g | head -2
            df -h "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" 2>/dev/null
            echo "HF_ENDPOINT=${HF_ENDPOINT:-unset}  HF_HOME=${HF_HOME:-unset}"
            for t in cargo rustup docker python3 git ccache cmake clang; do printf '%-8s %s\n' "$t" "$(command -v $t || echo -)"; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rust toolchain (cached under the tool cache)
        if: inputs.job == 'build' || inputs.job == 'validate'
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_HOME="$RUNNER_TOOL_CACHE/atlas/rustup" CARGO_HOME="$RUNNER_TOOL_CACHE/atlas/cargo"
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          if [ ! -x "$CARGO_HOME/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          {
            echo "RUSTUP_HOME=$RUSTUP_HOME"
            echo "CARGO_HOME=$CARGO_HOME"
          } >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Native strix-hip build (all models)
        if: inputs.job == 'build' || inputs.job == 'validate'
        shell: bash
        run: |
          set -euo pipefail
          cargo --version
          start=$(date +%s)
          ./build-amd.sh
          echo "build: $(( $(date +%s) - start ))s, binary $(sha256sum target/release/spark | cut -c1-16)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate (unit slice + smoke)
        if: inputs.job == 'validate'
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/spark --version | tee -a "$GITHUB_STEP_SUMMARY"
          ATLAS_SKIP_BUILD=1 cargo test -p atlas-kernels --lib 2>&1 | tail -5 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "validate: PASS" | tee -a "$GITHUB_STEP_SUMMARY"

  eval:
    name: Home-box eval gates (${{ inputs.model }})
    needs: authorize
    if: inputs.job == 'eval'
    runs-on: [self-hosted, atlas-home]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Submit model gates to the box queue
        shell: bash
        run: |
          set -euo pipefail
          echo "ref=${{ inputs.ref }} model=${{ inputs.model }} legs=${{ inputs.legs }}"
          ~/jobqueue/bin/qctl sub ci-eval-${{ github.run_id }} --file ~/jobqueue/staged/gate.sh             || { echo "no qctl gate.sh on this box"; exit 1; }
          echo "queued: leg scripts drive the box serially; verdicts land in ~/ovn-out" | tee -a "$GITHUB_STEP_SUMMARY"
