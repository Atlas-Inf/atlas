# Publish the Qwen3.8-Flash-Next NVFP4 serving image to ghcr.io.
#
# Deliberately MANUAL (workflow_dispatch) plus tags, not push-to-branch: the
# build compiles the whole CUDA path and every gb10 kernel target, so it is
# expensive and there is no reason to pay it per commit.
#
# WHAT THIS IMAGE DOES AND DOES NOT CONTAIN
#
# It contains the `spark` binary and the compiled kernels. It does NOT contain
# model weights — the RadixArk NVFP4 checkpoint is ~126 GB on disk and cannot
# ship in a container image. Users bind-mount it, and the 51.2 GB PLE n-gram
# table is demand-paged off that mount by row, so it must be LOCAL NVMe. See
# docker/gb10/qwen3.8-flash-next/nvfp4/Dockerfile for why.
#
# ARCHITECTURE: arm64 only. GB10 is aarch64 (sm_121); an x86 image would not
# run on the hardware this target exists for, so there is no multi-arch
# manifest to build and no value in pretending otherwise.
name: Publish qwen3.8-flash image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: short SHA)"
        required: false
        type: string
  push:
    tags:
      - "qwen3.8-flash-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-qwen38-flash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    # aarch64 runner: the target is GB10, so the image must be arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME#qwen3.8-flash-v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          # Lowercase: ghcr rejects uppercase in a repository path, and
          # organisation names are not guaranteed lowercase.
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/gb10/qwen3.8-flash-next/nvfp4/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/qwen3.8-flash:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/qwen3.8-flash:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "ghcr.io/${{ steps.meta.outputs.owner }}/qwen3.8-flash:${{ steps.meta.outputs.tag }}"
            echo '```'
            echo
            echo "Weights are NOT in the image. Bind-mount the checkpoint from"
            echo "local NVMe — the 51.2 GB PLE table is demand-paged off it by row."
          } >> "$GITHUB_STEP_SUMMARY"
