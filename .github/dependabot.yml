version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    # Version-update PRs are off (maintainer decision 2026-09-27: open-PR bloat).
    # Security updates still arrive; bumps are taken in one deliberate batch.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - rust
    groups:
      patch-updates:
        update-types:
          - patch
      minor-updates:
        update-types:
          - minor
    ignore:
      # CUDA FFI binding — pin intentionally, update manually with CUDA toolkit.
      - dependency-name: cudarc

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
    groups:
      actions-all:
        patterns:
          - "*"
